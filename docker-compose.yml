services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: stocktransfer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 on the host so it does not clash with a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocktransfer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
